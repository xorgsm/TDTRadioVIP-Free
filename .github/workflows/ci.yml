# Verificacion continua: lint + tests en cada push y pull request.
#
# Por que no se instala requirements.txt entero:
#   la suite (251 tests) pasa sin python-vlc, libtorrent ni pychromecast --
#   comprobado en un venv limpio con solo PySide6/requests/pytest/ruff. Esas
#   tres son dependencias binarias pesadas (libtorrent llega a no tener rueda
#   para la version de Python del runner) y meterlas aqui haria el CI lento y
#   fragil sin cubrir ni un test mas. Los modulos que las usan (core/caster,
#   core/torrent_client, player/vlc_*) se importan de forma perezosa o estan
#   cubiertos con dobles, por eso no hacen falta.
#
# QT_QPA_PLATFORM=offscreen: los tests crean QApplication y widgets reales;
# sin esto Qt aborta en el runner por no encontrar servidor grafico.

name: CI

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuevo sobre la misma rama cancela la ejecucion anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint y tests
    # Windows: es la unica plataforma de destino de la app (instalador Inno
    # Setup, NSSM, rutas %APPDATA%), asi que el CI debe correr donde corre.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 es la version con la que se construye el release (ver README
          # y TDTRadioVIP.spec); el CI debe usar la misma.
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias de verificacion
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.5" "requests>=2.31" "pytest>=7.4" "ruff>=0.6"

      - name: Comprobar estilo con ruff
        run: python -m ruff check .

      - name: Ejecutar la suite de tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Comprobar que todo el codigo compila
        # Detecta errores de sintaxis en modulos que ningun test importa
        # (paneles de torrents, cast, etc.), que ruff no siempre alcanza.
        run: python -m compileall -q core ui player main.py main_free.py
